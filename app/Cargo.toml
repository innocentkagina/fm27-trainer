[package]
name = "fm27-trainer"
version = "0.2.4-coach.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/innocentkagina/fm27-trainer"
description = "FM27 Coach (based on FM27 Trainer): Tactical Effectiveness, automatic training and live club tools for Football Manager 27"

build = "build.rs"

[[bin]]
name = "fm27-trainer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui-phosphor = "0.9"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3"
xcap = "0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNObservation",
    "VNTypes",
] }

[target.'cfg(windows)'.dependencies]
# de spellogica van de module; op Windows leest de app fm.exe van buitenaf
fm27-agent = { path = "../agent" }
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT"] }

[build-dependencies]
winresource = "0.1"
