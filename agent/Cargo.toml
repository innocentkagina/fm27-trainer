[package]
name = "fm27-agent"
version = "0.2.4-coach.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/innocentkagina/fm27-trainer"
description = "Leest en schrijft (op verzoek) clubbudget, blessures, moraal en training in FM27: op macOS als module in FM, op Windows van buitenaf"

[lib]
name = "fm27_agent"
# cdylib: de module die op macOS met FM meelaadt; rlib: de app gebruikt dezelfde code op Windows
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
] }
